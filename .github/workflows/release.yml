name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Verify, sign, and release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d1c243d3c3155e0b96542efac7c
        with:
          node-version: 22
      - uses: actions/setup-java@7a445ee88d4e23b52c33da1499c925b704b64c36
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: corepack enable
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: ./scripts/privacy-scan.sh
      - run: ./scripts/validate-version.sh
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web test:e2e
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMEHQ_KEYSTORE_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/homehq-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homehq-signing/homehq.jks"
          chmod 600 "$RUNNER_TEMP/homehq-signing/homehq.jks"
      - name: Build signed APK and tests
        env:
          HOMEHQ_KEYSTORE_PATH: ${{ runner.temp }}/homehq-signing/homehq.jks
          HOMEHQ_KEYSTORE_PASSWORD: ${{ secrets.HOMEHQ_KEYSTORE_PASSWORD }}
          HOMEHQ_KEY_ALIAS: ${{ secrets.HOMEHQ_KEY_ALIAS }}
          HOMEHQ_KEY_PASSWORD: ${{ secrets.HOMEHQ_KEY_PASSWORD }}
        run: ./gradlew lintRelease testDebugUnitTest jacocoTestCoverageVerification assembleRelease
      - run: ./scripts/verify-apk.sh android/app/build/outputs/apk/release/app-release.apk release
      - id: assets
        run: echo "directory=$(./scripts/make-release-assets.sh)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/changelog-section.sh "$version" > "$notes"
          gh release create "v$version" "${{ steps.assets.outputs.directory }}"/* \
            --title "Home HQ $version" --notes-file "$notes" --latest
