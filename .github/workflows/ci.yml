name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Activate pnpm 11.25.0
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm --dir web install --frozen-lockfile
      - run: ./scripts/privacy-scan.sh
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failures
          path: |
            web/playwright-report
            web/test-results

  android:
    name: Android checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Activate pnpm 11.25.0
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: ./gradlew lintDebug testDebugUnitTest jacocoTestCoverageVerification assembleDebug
      - run: ./scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/app-debug.apk

  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: ./scripts/privacy-scan.sh
      - run: ./scripts/validate-version.sh
