name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d1c243d3c3155e0b96542efac7c
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm --dir web install --frozen-lockfile
      - run: ./scripts/privacy-scan.sh
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: failure()
        with:
          name: browser-failures
          path: |
            web/playwright-report
            web/test-results

  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d1c243d3c3155e0b96542efac7c
        with:
          node-version: 22
      - uses: actions/setup-java@7a445ee88d4e23b52c33da1499c925b704b64c36
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: corepack enable
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: ./gradlew lintDebug testDebugUnitTest jacocoTestCoverageVerification assembleDebug
      - run: ./scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk debug
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/app-debug.apk

  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: ./scripts/privacy-scan.sh
      - run: ./scripts/validate-version.sh
